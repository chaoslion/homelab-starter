services:
  registry:
    image: docker.io/registry:latest
    container_name: registry
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "['*']"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: "[HEAD,GET,OPTIONS,DELETE]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: "[Accept,Cache-Control]"
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: "[Docker-Content-Digest]"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_LOG_LEVEL: info
    volumes:
      - storage-registry:/var/lib/registry
    ports: [5000:5000]

  registry-ui:
    image: docker.io/joxit/docker-registry-ui:main
    container_name: registry-ui
    restart: unless-stopped
    ports: [8080:80]
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: Homelab Docker Registry
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      PULL_URL: "homelab-registry:5000"
      NGINX_PROXY_PASS_URL: http://registry:5000
      SHOW_CATALOG_NB_TAGS: "true"
      CATALOG_MIN_BRANCHES: 1
      CATALOG_MAX_BRANCHES: 1
      TAGLIST_PAGE_SIZE: 100
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: 1000

  dockhand:
    image: fnsys/dockhand:v1.0.44
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./homelab-dockhand/data:/app/data

volumes:
  storage-registry: {}
