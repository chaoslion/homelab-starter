interval: 1m
rules:
  - alert: HostOutOfMemory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
    for: 10m
    labels:
      severity: warning
    annotations:
      description: "Host is running low on available memory."
      summary: '{{ $labels.instance }}: {{ $value | printf "%.0f" }}% available'

  - alert: HostOutOfDiskSpace
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 < 10
    for: 10m
    labels:
      severity: warning
    annotations:
      description: "Host filesystem is running low on free space."
      summary: '{{ $labels.instance }} ({{ $labels.mountpoint }}): {{ $value | printf "%.0f" }}% free'

  - alert: HostHighCpuLoad
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
    for: 15m
    labels:
      severity: warning
    annotations:
      description: "Host CPU load is sustained high, which may cause slow response times."
      summary: '{{ $labels.instance }}: {{ $value | printf "%.0f" }}%'

  - alert: HostCpuPackageWarm
    expr: node_thermal_zone_temp{type="x86_pkg_temp"} > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      description: "Host CPU package temperature is elevated."
      summary: '{{ $labels.instance }}: {{ $value | printf "%.0f" }}°C'

  - alert: HostCpuPackageCritical
    expr: node_thermal_zone_temp{type="x86_pkg_temp"} >= 95
    for: 2m
    labels:
      severity: critical
    annotations:
      description: "Host CPU package temperature is critically high, risking thermal throttling or shutdown."
      summary: '{{ $labels.instance }}: {{ $value | printf "%.0f" }}°C'
