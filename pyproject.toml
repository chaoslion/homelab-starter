[project]
name = "homelab"
version = "0.1.0"
description = "A homelab automation project using Ansible and Python"
requires-python = ">=3.13"
dependencies = [
    "ansible-core>=2.21.3",
    "jinja2>=3.1.2,<4.0.0",
    "netaddr>=1.3.0,<2.0.0",
    "pydantic>=2.11.5,<3.0.0",
]

[tool.pyright]
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
